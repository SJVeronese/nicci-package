[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nicci"
version = "1.1.0"
description = "A collection of functions for the analysis of astronomical data cubes and images"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Simone Veronese", email = "veronese.astro@gmail.com" }
]
keywords = ["astronomy", "radio astronomy", "HI", "rotation curves", "data cubes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "astropy",
    "pandas",
    "tqdm",
    "mcfit",
    "pvextractor",
    "colourspace-explorer",
	"astroquery",
	"photutils",
]

[project.urls]
Homepage = "https://github.com/SJVeronese/nicci-package"
Repository = "https://github.com/SJVeronese/nicci-package"
Issues = "https://github.com/SJVeronese/nicci-package/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]